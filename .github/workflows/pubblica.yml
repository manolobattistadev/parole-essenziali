name: Pubblica

# Il cron è in UTC: ogni fascia (09, 13, 19 ora di Roma) è coperta sia con l'ora solare
# che con quella legale. Lo script decide da solo se c'è una fascia da pubblicare.
on:
  schedule:
    - cron: "52 6,7,10,11,16,17 * * *"
  workflow_dispatch:
    inputs:
      fascia:
        description: "Forza una fascia (es. 09:00). Vuoto = automatico"
        required: false
      forza:
        description: "Ripubblica anche i contenuti già usciti"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Prepara i contenuti
        id: prep
        env:
          FASCIA: ${{ inputs.fascia }}
          FORZA: ${{ inputs.forza }}
        run: |
          ARGS=""
          if [ -n "$FASCIA" ]; then ARGS="--fascia $FASCIA"; fi
          if [ "$FORZA" = "true" ]; then ARGS="$ARGS --forza"; fi
          python -m bot prepara $ARGS

      - if: steps.prep.outputs.da_fare == 'true'
        uses: actions/configure-pages@v5

      - if: steps.prep.outputs.da_fare == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - if: steps.prep.outputs.da_fare == 'true'
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Pubblica su Instagram
        if: steps.prep.outputs.da_fare == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python -m bot pubblica --base-url "${{ steps.deploy.outputs.page_url }}"

      - name: Salva il registro
        if: always() && steps.prep.outputs.da_fare == 'true'
        run: |
          git config user.name "parole-essenziali[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pubblicati.json
          git diff --cached --quiet && exit 0
          git commit -m "Pubblicato $(jq -r '.data + " " + .fascia' out/lavoro.json)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
